spring:
    jpa:
        properties:
            hibernate:
                generate_statistics: true # For BaseEndpointIntegrationTest.countQueries
    mail:
        default-encoding: UTF-8
        host: localhost
        username: user@example.com
        password: secret
        test-connection: false
        properties:
            mail:
                debug: true
                smtp:
                    from: no-reply@wutsi.com
                    port: 3025
                    auth: false
                    starttls:
                        enable: false
                        required: false

ndopify:
    security:
        jwt:
            secret: qa-secret-not-for-prod-0123456789abcdef
    contract:
        expire:
            cron: "-" # Never on its own: tests call ContractJobs
        signed-content:
            cron: "-" # Never on its own: tests call ContractJobs
    listing:
        verify:
            cron: "-" # Never on its own: tests call ListingJobs
        publish:
            cron: "-" # Never on its own: tests call ListingJobs
    mandate:
        assignment:
            jitter: 0 # Deterministic scores
            night: # No night: the endpoint tests don't depend on the time they run. The night is unit tested
                start: "00:00"
                end: "00:00"
            expire:
                cron: "-" # Never on its own: a run mid-suite would expire the fixtures' offers. Tests call MandateJobs
            dispatch:
                cron: "-"
