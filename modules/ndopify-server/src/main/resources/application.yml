spring:
    threads:
        virtual:
            enabled: true

    http:
        clients:
            # Boot's HttpClientSettings: the Spring-built clients, and the MTN HttpClient (MoMoConfiguration).
            connect-timeout: 5s
            read-timeout: 30s

    ai:
        chat:
            client:
                enabled: false # Two ChatModels: the ChatClients are built by AIConfiguration
        openai: # Vision model
            api-key: ${DEEPSEEK_API_KEY}
            base-url: https://api.deepseek.com
            chat:
                options:
                    model: deepseek-flash
        deepseek: # Text model
            api-key: ${DEEPSEEK_API_KEY}
            base-url: https://api.deepseek.com
            chat:
                options:
                    model: deepseek-flash
        retry:
            max-attempts: 3
            on-http-codes: 429
            backoff:
                initial-interval: 1s
                max-interval: 20s

    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/ndopify?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
        username: root
        password:
        hikari:
            connection-timeout: 30000
            connection-test-query: "SELECT 1"
            idle-timeout: 600000             # 10 mins
            initialization-fail-timeout: 60000
            leak-detection-threshold: 0
            max-lifetime: 1800000            # 30 mins
            maximum-pool-size: ${ndopify.database.pool-size}
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 250
                prepStmtCacheSqlLimit: 2048
    flyway:
        clean-disabled: false
        locations: "classpath:db/migration/common,classpath:db/migration/local"
    jpa:
        show-sql: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: com.wutsi.ndopify.util.jpa.CustomPhysicalNamingStrategy
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                # Loads lazy collections / associations of up to 50 entities in one query (WHERE id IN ...),
                # rather than one query per entity (N+1). See BaseEndpointIntegrationTest.countQueries
                default_batch_fetch_size: 50

    jackson:
        default-property-inclusion: non_null
        use-jackson2-defaults: true
        deserialization:
            FAIL_ON_UNKNOWN_PROPERTIES: false
            FAIL_ON_NULL_FOR_PRIMITIVES: false
            ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
        mapper:
            ACCEPT_CASE_INSENSITIVE_ENUMS: true
            ACCEPT_CASE_INSENSITIVE_PROPERTIES: true

    mail:
        default-encoding: UTF-8
        host: localhost # Local SMTP server mailpit - for testing
        username: user@example.com
        password: secret
        test-connection: false
        properties:
            mail:
                debug: false
                smtp:
                    auth: false
                    port: 1025
                    from: no-reply@wutsi.com
                    connectiontimeout: 10000
                    timeout: 10000
                    writetimeout: 10000
                    starttls:
                        enable: false
    mvc:
        pathmatch:
            matching-strategy: ANT_PATH_MATCHER

    servlet:
        multipart:
            max-file-size: 10240KB
            max-request-size: 10240KB

    task:
        execution:
            thread-name-prefix: "ndopify-async-"
            # With virtual threads the pool settings are ignored; simple.concurrency-limit is the equivalent cap.
            pool:
                core-size: 4
                max-size: 16
                queue-capacity: 100
                keep-alive: 60s
                allow-core-thread-timeout: true
            simple:
                concurrency-limit: 16
            shutdown:
                await-termination: true
                await-termination-period: 30s
        scheduling:
            thread-name-prefix: "ndopify-job-"
            # With virtual threads the pool size is ignored; simple.concurrency-limit is the equivalent cap.
            pool:
                size: 4
            simple:
                concurrency-limit: 4
            shutdown:
                await-termination: true
                await-termination-period: 30s

server:
    port: 8080
    compression:
        enabled: true
        mime-types: application/json,application/xml,text/html,text/xml,text/plain
        min-response-size: 512

springdoc:
    packages-to-scan: com.wutsi.ndopify
    show-actuator: true
    swagger-ui:
        path: /api.html
        operations-sorter: alpha
        tags-sorter: alpha
    group-configs:
        -   group: agent
            display-name: Agent API
            paths-to-match:
                - /v1/agents
                - /v1/agents/**

        -   group: contract
            display-name: Contract API
            paths-to-match:
                - /v1/contracts
                - /v1/contracts/**

        -   group: customer
            display-name: Customer API
            paths-to-match:
                - /v1/customers
                - /v1/customers/**

        -   group: mandates
            display-name: Mandates API
            paths-to-match:
                - /v1/mandates
                - /v1/mandates/**
                - /v1/assignments
                - /v1/assignments/**

        -   group: match
            display-name: Match API
            paths-to-match:
                - /v1/matches
                - /v1/matches/**

        -   group: party
            display-name: Party API
            paths-to-match:
                - /v1/kyc
                - /v1/kyc/**
                - /v1/parties
                - /v1/parties/**
                - /v1/identifications
                - /v1/identifications/**
                - /v1/payment-methods
                - /v1/payment-methods/**

        -   group: refdata
            display-name: RefData API
            paths-to-match:
                - /v1/applications
                - /v1/locations
                - /v1/locations/**
                - /v1/tenants
                - /v1/tenants/**

        -   group: security
            display-name: Security API
            paths-to-match:
                - /v1/auth
                - /v1/auth/**
                - /v1/users
                - /v1/users/**

        -   group: visit
            display-name: Visit API
            paths-to-match:
                - /v1/visits
                - /v1/visits/**

management:
    endpoint:
        health:
            show-details: always
            group:
                llm: # The LLM is out of the default group, see ChatClientHealthEndpointGroupsPostProcessor
                    include: "visionChatClient,textChatClient"
        info:
            git:
                mode: full
    endpoints:
        web:
            exposure:
                include: "beans,flyway,health,info,scheduledtasks,mappings"

logging:
    level:
        root: INFO
        com.amazonaws: ERROR
        com.icegreen.greenmail.smtp.SmtpManager: DEBUG
        org.springframework: INFO
        org.hibernate: ERROR
        org.apache.poi: ERROR
        org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
        com.wutsi: DEBUG
        springfox: ERROR
    pattern:
        console: "%d level=%level logger=%c{20} %m%n"
        file: "%d level=%level logger=%c{20} %m%n"

ndopify:
    endpoints:
        ops: true                          # @OpsEndpoint endpoints (admin-only): off in prod
    image:
        type: local                        # local | image-kit
        image-kit:
            origin-url: ""
            endpoint-url: "https://ik.imagekit.io/key"
    telegram:
        token: ${TELEGRAM_TOKEN}           # No default: the server doesn't start without it
        username: ${TELEGRAM_BOT_USERNAME} # No default: the bot's public username, used in the connection e-mail's link
        transport: polling                  # polling (local) | webhook (TEST/PROD)
        webhook:
            url: ""                         # ${SERVER_URL}/telegram/webhook in TEST/PROD
            secret: ""                      # TELEGRAM_WEBHOOK_SECRET in TEST/PROD
        polling:
            enabled: true
            timeout-seconds: 20
        health:
            up-ttl-minutes: 5
            down-ttl-minutes: 1
    security:
        jwt:
            secret: local-dev-secret-not-for-prod-0123456789 # Dummy: test and prod use the JWT_SECRET env variable
        access-token:
            ttl: # Per ApplicationCode: also how long the web apps keep their cookie
                public-portal: 5d
                admin-console: 1h
                partner-central: 30d   # The idle window: an agent who opens Partner Central once a month stays signed in
                e-signature: 1h
                match-link: 365d       # The token of the customer links of the proposal and visit e-mails (MatchLinkTokenService)
            max-lifetime: 90d          # Absolute cap on a session, from its first sign-in
            default-ttl: 1h            # An application not listed above
        otp:
            max-failed-attempts: 5         # Wrong codes after which the account is locked
            lock-duration: 1h              # How long the account stays locked
    database:
        pool-size: 8
    ai:
        health: # /actuator/health/llm is public and each check is a paid call: the result is cached
            up-ttl-minutes: 5
            down-ttl-minutes: 1

    mail:
        verification:
            provider: none                    # none | ses; ses in TEST and PROD
            ses:
                region: us-east-1                        # The storage region
                access-key: "${AWS_ACCESS_KEY:}"         # Heroku config var (v1's name); empty = SDK default chain
                secret-key: "${AWS_SECRET_KEY:}"
            ttl:
                valid-days: 30                # HIGH / MEDIUM
                invalid-days: 7               # LOW
            timeout-seconds: 2                # A slow SES never holds a mandate submission
            throttle:                         # A budget guard: past either, accept without verifying
                per-ip-per-hour: 20
                daily-cap: 500
            health: # /actuator/health is public and SES throttles around one call per second: the result is cached
                up-ttl-minutes: 1
                down-ttl-seconds: 15

    agent:
        telegram:
            code-ttl-minutes: 15          # How long the 6-digit connection code stays valid

    contract:
        signature:
            ttl-days: 7                    # The parties have 7 days to sign, from the last request for signature
        expire:
            cron: "0 */15 * * * ?"         # Every 15 minutes: contracts not signed in time, or past their end date
        signed-content:
            cron: "0 0 * * * ?"            # Every hour: signed contracts whose PDF wasn't generated on their signature
            delay-minutes: 10              # Not before 10 minutes after the signature, the time for the listener to do it
            window-days: 7                 # Given up 7 days after the signature (logged on each run until then)

    listing:
        min-images: 5                      # A listing must have at least 5 images to be published
        publish:
            require-owner-verification: true   # Publication gate: a VERIFIED listing waits until its mandate's owner is VERIFIED
            cron: "0 */15 * * * ?"             # Every 15 minutes: publish listings that are VERIFIED or PUBLISHING
        verify:
            cron: "0 */15 * * * ?"         # Every 15 minutes: verify listings that are UNDER_VERIFICATION
        close:
            cron: "0 30 1 * * ?"           # Every day at 01:30: PUBLISHED listings of closed mandates the listener missed

    mandate:
        assignment:
            jitter: 0.01                   # Random tie-break; 0 in tests, so scores are deterministic
            ttl-minutes: 60                # An agent has 1h (of daytime) to accept an offer
            max-load: 5                    # Max mandates an agent can work on at the same time
            max-pending: 3                 # An agent with 3 offers unanswered gets no more until answering one
            nearby-radius-km: 3            # Neighbourhoods this close to the mandate's are "nearby"
            nearby-max-neighborhoods: 20   # Only the nearest ones (searchNearest returns them nearest first)
            manual-after-days: 3           # Without an agent after 3 days, the mandate goes to MANUAL_ASSIGNMENT
            night: # No offer, and the TTL is paused, from start to end (tenant's local time)
                start: "06:59" # In local environment, start end end almost the same intentionally, to test the night logic
                end: "07:00"
            expire:
                cron: "0 */15 * * * ?"     # Every 15 minutes: offers past their TTL go to the next agent
            dispatch:
                cron: "0 */15 * * * ?"     # Every 15 minutes: mandates that came at night, or had no candidate
        contract:
            duration-months: 6             # A mandate's contract is valid for 6 months from its signature
            sale-commission-rate: 5        # A sale mandate's success commission, in % of the sale price
        document:
            extract:
                cron: "0 */15 * * * ?"           # Every 15 minutes: documents not read yet, or left EXTRACTING
                batch-size: 100                  # Documents examined per tenant per run
                max-attempts: 3                  # Technical failures retried in the run, then FAILED
                min-confidence: 0.7              # A required field below this confidence fails the document
                in-progress-timeout-minutes: 15  # An EXTRACTING document older is interrupted: it's retried
        ownership:
            name-threshold: 90             # 0..100: below it, an ID or a title does not name the customer (as KYC)

    match:
        price-tolerance: 0.10           # A listing up to 10% over the budget is still a match, scored down
        min-score: 0.5                  # Below, the pair isn't stored
        ownership-bonus: 0.10           # 0..1: a listing whose owner was verified ranks as if it scored this much higher; 0 = today's order
        nearby-radius-km: 3             # Neighbourhoods this close to the searched ones are "nearby"
        nearby-max-neighborhoods: 20
        notify:
            cron: "0 */15 * * * ?"      # Every 15 minutes: e-mails the agents about their new matches
        rematch:
            cron: "0 */15 * * * ?"      # Every 15 minutes: re-matches the open searches (runs lost, scores vs today)
        expire:
            days: 7                     # A proposal the customer doesn't answer within 7 days expires
            cron: "0 0 2 * * ?"         # Every day at 02:00: expires the proposals not answered in time
        resend:
            min-interval: 15m           # A match can't be resent to its customer before this delay
        auto-propose:
            after-hours: 24                 # A match the agent hasn't touched for 24h is proposed to the customer
            batch-size: 100                 # Matches examined per run
            cron: "30 */15 * * * ?"         # Every 15 minutes, offset from the other 15-minute jobs
        visit-reminder:
            delay-days: 3                   # An ACCEPTED match with no visit is reminded after this delay
            batch-size: 100                 # Matches reminded per run
            cron: "0 0 9 * * ?"             # Every day at 09:00: reminds the customers who accepted a match but booked no visit
        agent-visit-nudge:
            delay-hours: 48                 # An ACCEPTED match with no visit nudges its agent after this delay
            batch-size: 100                 # Matches examined per run
            cron: "0 30 9 * * ?"            # Every day at 09:30, after the customer reminder (09:00)

    mobile-money:
        mtn:
            environment: sandbox
            callback-url: http://127.0.0.1/mtn/callback
            collection:
                user-id: "no-user-id" # Dummy: test and prod use the MTN_COLLECTION_USER_ID env variable
                api-key: "no-api-key" # Dummy: test and prod use the MTN_COLLECTION_API_KEY env variable
                subscription-key: "no-api-key" # Dummy: test and prod use the MTN_COLLECTION_SUBSCRIPTION_KEY env variable

    party:
        kyc:
            image:
                url-ttl-seconds: 3600   # 1h
            verify:
                cron: "0 */15 * * * ?"    # Every 15 minutes
                in-progress-timeout-minutes: 15  # A case UNDER_VERIFICATION for longer was interrupted: it's retried

    storage:
        default-type: local
        upload-url-ttl-seconds: 600    # How long a browser has to PUT a file straight to the storage
        local:
            directory: /${user.home}/ndopify
            servlet-path: /storage
        s3:
            bucket: com-wutsi-ndopify-local
            region: us-east-1

    ref-data:
        geonames:
            connect-timeout: 30000
            read-timeout: 60000

    visit:
        policy: # The delays and tolerances of a visit's lifecycle
            check-in-before: 1h          # How early the agent may check in
            check-in-after: 4h           # How late the agent may check in, report a no-show, or be marked absent
            no-show-delay: 15m           # The customer can't be reported absent before this delay
            check-out-minimum: 10m       # The minimum length of a visit, before the agent may check out
            expire-after: 48h            # Minimum age of a request before it expires, once its requested slot has also passed
            remind-before: 24h           # A confirmed visit starting within this delay is reminded
            max-code-attempts: 5         # Wrong codes after which the visit's code is locked
            flag-distance-meters: 300    # A check-in farther than this from the listing is flagged
        expire:
            cron: "0 0 * * * ?"         # Every hour: visit requests not scheduled, 48 h old and past their requested slot
        reminder:
            cron: "0 */15 * * * ?"      # Every 15 minutes: confirmed visits starting within 24 h
        no-show:
            cron: "0 0 * * * ?"         # Every hour: confirmed visits whose agent didn't check in 4 h after the time
        cancel-ended-mandates:
            cron: "0 30 * * * ?"        # Every hour: open visits whose mandate ended without its async listener
