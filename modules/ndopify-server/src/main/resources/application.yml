spring:
    http:
        clients:
            # Boot's HttpClientSettings: the Spring-built clients, and the MTN HttpClient (MoMoConfiguration).
            connect-timeout: 5s
            read-timeout: 30s

    ai:
        chat:
            client:
                enabled: false # Two ChatModels: the ChatClients are built by AIConfiguration
        openai: # Vision model
            api-key: ${KIMI_API_KEY}
            base-url: https://api.moonshot.ai/v1
            chat:
                options:
                    model: kimi-k2.6
        deepseek: # Text model
            api-key: ${DEEPSEEK_API_KEY}
            base-url: https://api.deepseek.com
            chat:
                options:
                    model: deepseek-flash

    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/ndopify?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
        username: root
        password:
        hikari:
            connection-timeout: 30000
            connection-test-query: "SELECT 1"
            idle-timeout: 600000             # 10 mins
            initialization-fail-timeout: 60000
            leak-detection-threshold: 0
            max-lifetime: 1800000            # 30 mins
            maximum-pool-size: ${ndopify.database.pool-size}
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 250
                prepStmtCacheSqlLimit: 2048
    flyway:
        clean-disabled: false
        locations: "classpath:db/migration/common,classpath:db/migration/local"
    jpa:
        show-sql: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: com.wutsi.ndopify.util.jpa.CustomPhysicalNamingStrategy
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                # Loads lazy collections / associations of up to 50 entities in one query (WHERE id IN ...),
                # rather than one query per entity (N+1). See BaseEndpointIntegrationTest.countQueries
                default_batch_fetch_size: 50

    jackson:
        default-property-inclusion: non_null
        use-jackson2-defaults: true
        deserialization:
            FAIL_ON_UNKNOWN_PROPERTIES: false
            FAIL_ON_NULL_FOR_PRIMITIVES: false
            ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
        mapper:
            ACCEPT_CASE_INSENSITIVE_ENUMS: true
            ACCEPT_CASE_INSENSITIVE_PROPERTIES: true

    mail:
        default-encoding: UTF-8
        host: localhost # Local SMTP server mailpit - for testing
        username: user@example.com
        password: secret
        test-connection: false
        properties:
            mail:
                debug: false
                smtp:
                    auth: false
                    port: 1025
                    from: no-reply@wutsi.com
                    connectiontimeout: 10000
                    timeout: 10000
                    writetimeout: 10000
                    starttls:
                        enable: false
    mvc:
        pathmatch:
            matching-strategy: ANT_PATH_MATCHER

    servlet:
        multipart:
            max-file-size: 10240KB
            max-request-size: 10240KB

    task:
        execution:
            thread-name-prefix: "ndopify-async-"
            pool:
                core-size: 4
                max-size: 16
                queue-capacity: 100
                keep-alive: 60s
                allow-core-thread-timeout: true
            shutdown:
                await-termination: true
                await-termination-period: 30s
        scheduling:
            thread-name-prefix: "ndopify-job-"
            pool:
                size: 4
            shutdown:
                await-termination: true
                await-termination-period: 30s

server:
    port: 8080
    compression:
        enabled: true
        mime-types: application/json,application/xml,text/html,text/xml,text/plain
        min-response-size: 512

springdoc:
    packages-to-scan: com.wutsi.ndopify
    show-actuator: true
    swagger-ui:
        path: /api.html
        operations-sorter: alpha
        tags-sorter: alpha
    group-configs:
        -   group: agent
            display-name: Agent API
            paths-to-match:
                - /v1/agents
                - /v1/agents/**

        -   group: contract
            display-name: Contract API
            paths-to-match:
                - /v1/contracts
                - /v1/contracts/**

        -   group: customer
            display-name: Customer API
            paths-to-match:
                - /v1/customers
                - /v1/customers/**

        -   group: mandates
            display-name: Mandates API
            paths-to-match:
                - /v1/mandates
                - /v1/mandates/**
                - /v1/assignments
                - /v1/assignments/**

        -   group: party
            display-name: Party API
            paths-to-match:
                - /v1/kyc
                - /v1/kyc/**
                - /v1/parties
                - /v1/parties/**
                - /v1/identifications
                - /v1/identifications/**
                - /v1/payment-methods
                - /v1/payment-methods/**

        -   group: refdata
            display-name: RefData API
            paths-to-match:
                - /v1/applications
                - /v1/locations
                - /v1/locations/**
                - /v1/tenants
                - /v1/tenants/**

        -   group: security
            display-name: Security API
            paths-to-match:
                - /v1/auth
                - /v1/users
                - /v1/users/**

management:
    endpoint:
        health:
            show-details: always
            group:
                llm: # The LLM is out of the default group, see ChatClientHealthEndpointGroupsPostProcessor
                    include: "visionChatClient,textChatClient"
        info:
            git:
                mode: full
    endpoints:
        web:
            exposure:
                include: "beans,flyway,health,info,scheduledtasks,mappings"

logging:
    level:
        root: INFO
        com.amazonaws: ERROR
        com.icegreen.greenmail.smtp.SmtpManager: DEBUG
        org.springframework: INFO
        org.hibernate: ERROR
        org.apache.poi: ERROR
        org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
        com.wutsi: DEBUG
        springfox: ERROR

    pattern:
        console: "%d Type=%level Logger=%c Thread=%thread %m%n"
        file: "%d Type=%level Logger=%c Thread=%thread %m%n"

ndopify:
    endpoints:
        ops: true                          # @OpsEndpoint endpoints (unauthenticated): off in prod
    security:
        jwt:
            secret: local-dev-secret-not-for-prod-0123456789 # Dummy: test and prod use the JWT_SECRET env variable
    database:
        pool-size: 8
    ai:
        health: # /actuator/health/llm is public and each check is a paid call: the result is cached
            up-ttl-minutes: 5
            down-ttl-minutes: 1

    contract:
        signature:
            ttl-days: 7                    # The parties have 7 days to sign, from the last request for signature
        expire:
            cron: "0 */15 * * * ?"         # Every 15 minutes: contracts not signed in time, or past their end date
        signed-content:
            cron: "0 0 * * * ?"            # Every hour: signed contracts whose PDF wasn't generated on their signature
            delay-minutes: 10              # Not before 10 minutes after the signature, the time for the listener to do it
            window-days: 7                 # Given up 7 days after the signature (logged on each run until then)

    listing:
        min-images: 5                      # A listing must have at least 5 images to be published
        publish:
            cron: "0 */15 * * * ?"         # Every 15 minutes: publish listings that are PUBLISHING
        verify:
            cron: "0 */15 * * * ?"         # Every 15 minutes: verify listings that are UNDER_VERIFICATION

    mandate:
        assignment:
            jitter: 0.01                   # Random tie-break; 0 in tests, so scores are deterministic
            ttl-minutes: 60                # An agent has 1h (of daytime) to accept an offer
            max-load: 5                    # Max mandates an agent can work on at the same time
            nearby-radius-km: 3            # Neighbourhoods this close to the mandate's are "nearby"
            nearby-max-neighborhoods: 20   # Only the nearest ones (searchNearest returns them nearest first)
            manual-after-days: 3           # Without an agent after 3 days, the mandate goes to MANUAL_ASSIGNMENT
            night: # No offer, and the TTL is paused, from start to end (tenant's local time)
                start: "06:59" # In local environment, start end end almost the same intentionally, to test the night logic
                end: "07:00"
            expire:
                cron: "0 */15 * * * ?"     # Every 15 minutes: offers past their TTL go to the next agent
            dispatch:
                cron: "0 */15 * * * ?"     # Every 15 minutes: mandates that came at night, or had no candidate
        contract:
            duration-months: 6             # A mandate's contract is valid for 6 months from its signature

    mobile-money:
        mtn:
            environment: sandbox
            callback-url: http://127.0.0.1/mtn/callback
            collection:
                user-id:
                api-key:
                subscription-key: ${MTN_COLLECTION_SUBSCRIPTION_KEY}

    party:
        kyc:
            image:
                url-ttl-seconds: 3600   # 1h
            verify:
                cron: "0 */15 * * * ?"    # Every 15 minutes
                in-progress-timeout-minutes: 15  # A case UNDER_VERIFICATION for longer was interrupted: it's retried

    storage:
        default-type: local
        local:
            directory: /${user.home}/ndopify
            servlet-path: /storage
        s3:
            bucket: com-wutsi-ndopify-local
            region: us-east-1

    ref-data:
        geonames:
            connect-timeout: 30000
            read-timeout: 60000
