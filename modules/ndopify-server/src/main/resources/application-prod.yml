# Only health is public in prod: no Swagger, no other actuator endpoint, no health details
management:
    endpoint:
        health:
            show-details: never
    endpoints:
        web:
            exposure:
                include: "health"

spring:
    flyway:
        clean-disabled: false

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

ndopify:
    endpoints:
        ops: false                         # The @OpsEndpoint endpoints are unauthenticated

    storage:
        default-type: s3
        s3:
            bucket: com-wutsi-ndopify-prod
            region: us-east-1
