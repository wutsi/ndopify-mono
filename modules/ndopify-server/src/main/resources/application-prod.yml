# Only health is public in prod: no Swagger, no other actuator endpoint, no health details
management:
    endpoint:
        health:
            show-details: never
    endpoints:
        web:
            exposure:
                include: "health"

spring:
    flyway:
        clean-disabled: true
    jpa:
        show-sql: false
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    mail:
        host: ${SMTP_HOST}
        username: ${SMTP_USER}
        password: ${SMTP_PASSWORD}
        properties:
            mail:
                smtp:
                    port: ${SMTP_PORT}
                    auth: true
                    starttls:
                        enable: true

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

ndopify:
    endpoints:
        ops: false                         # The @OpsEndpoint endpoints are unauthenticated
    security:
        jwt:
            secret: ${JWT_SECRET}          # No default: the server doesn't start without it

    database:
        pool-size: 16

    contract:
        expire:
            cron: "0 0 1 * * ?"            # Every day at 01:00: contracts not signed in time, or past their end date

    listing:
        min-images: 5                      # A listing must have at least 5 images to be published
        verify:
            cron: "0 * */1 * * ?"          # Every hour: verify listings that are PENDING
        publish:
            cron: "0 * */1 * * ?"          # Every hour: publish listings that are PUBLISHING

    mandate:
        assignment:
            expire:
                cron: "0 */15 * * * ?"     # Every 15 minutes: offers past their TTL go to the next agent
            dispatch:
                cron: "0 */30 * * * ?"     # Every 30 minutes: mandates that came at night, or had no candidate

    party:
        kyc:
            verify:
                cron: "0 0 * * * ?"    # Every hours

    storage:
        default-type: s3
        s3:
            bucket: com-wutsi-ndopify-prod
            region: us-east-1
