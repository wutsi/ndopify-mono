# Only health is public in prod: no Swagger, no other actuator endpoint, no health details
management:
    endpoint:
        health:
            show-details: never
    endpoints:
        web:
            exposure:
                include: "health"

spring:
    flyway:
        clean-disabled: true
    jpa:
        show-sql: false
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    mail:
        host: ${SMTP_HOST}
        username: ${SMTP_USER}
        password: ${SMTP_PASSWORD}
        properties:
            mail:
                smtp:
                    port: ${SMTP_PORT}
                    auth: true
                    starttls:
                        enable: true

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

ndopify:
    endpoints:
        ops: false                         # The @OpsEndpoint endpoints are unauthenticated
    security:
        jwt:
            secret: ${JWT_SECRET}          # No default: the server doesn't start without it

    database:
        pool-size: 16

    contract:
        expire:
            cron: "0 0 1 * * ?"            # Every day at 01:00: contracts not signed in time, or past their end date

    listing:
        min-images: 5                      # A listing must have at least 5 images to be published
        publish:
            cron: "0 0 */1 * * ?"          # Every hour: publish listings that are VERIFIED or PUBLISHING
        verify:
            cron: "0 15 */1 * * ?"         # Every hour at 15 minutes: verify listings that are UNDER_VERIFICATION
        close:
            cron: "0 30 1 * * ?"           # Every day at 01:30: PUBLISHED listings of closed mandates the listener missed

    mandate:
        assignment:
            expire:
                cron: "0 0 */1 * * ?"      # Every hour: offers past their TTL go to the next agent
            dispatch:
                cron: "0 15 */1 * * ?"     # Every hour et 15 minutes: mandates that came at night, or had no candidate
            night:
                start: "22:00"
                end: "07:00"

    match:
        notify:
            cron: "0 0 */1 * * ?"       # Every hour: e-mails the agents about their new matches
        rematch:
            cron: "0 0 1 * * ?"         # Every day at 01:00: re-matches the open searches (runs lost, scores vs today)
        expire:
            days: 7                     # A proposal the customer doesn't answer within 7 days expires
            cron: "0 0 2 * * ?"         # Every day at 02:00: expires the proposals not answered in time

    mobile-money:
        mtn:
            environment: production
            callback-url: http://127.0.0.1/mtn/callback
            collection:
                user-id: ${MTN_COLLECTION_USER_ID}
                api-key: ${MTN_COLLECTION_API_KEY}
                subscription-key: ${MTN_COLLECTION_SUBSCRIPTION_KEY}

    party:
        kyc:
            verify:
                cron: "0 0 * * * ?"    # Every hours

    storage:
        default-type: s3
        s3:
            bucket: com-wutsi-ndopify-prod
            region: us-east-1

    visit:
        expire:
            cron: "0 0 */1 * * ?"      # Every hour: visit requests the agent didn't schedule in 48 h
        reminder:
            cron: "0 15 */1 * * ?"     # Every hour at 15 minutes: confirmed visits starting within 24 h
        no-show:
            cron: "0 15 */1 * * ?"      # Every hour at 15 minutes: confirmed visits whose agent didn't check in 4 h after the time
