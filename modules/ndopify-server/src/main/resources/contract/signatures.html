<div class="signatures">
    <h2>Signatures</h2>
    {{#signatures}}
    <table class="signature">
        <tr>
            <td class="signature__qr"><img src="{{qrCodeDataUri}}" width="96" height="96" alt="QR code"/></td>
            <td>
                <div>Signé par : <strong>{{legalName}}</strong></div>
                <div>Date : {{signedAt}}</div>
                <div class="signature__hash">Hash de la signature : {{signatureHash}}</div>
                <div class="signature__hint">Scannez le QR code pour vérifier cette signature.</div>
            </td>
        </tr>
    </table>
    {{/signatures}}
</div>
