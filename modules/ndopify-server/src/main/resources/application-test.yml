spring:
    ai:
        openai:
            api-key: ${KIMI_API_KEY}
            base-url: https://api.moonshot.ai/v1
            chat:
                options:
                    model: kimi-k2.6

    flyway:
        clean-disabled: false
        locations: "classpath:db/migration/common,classpath:db/migration/test"
    jpa:
        show-sql: false
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    mail:
        host: ${SMTP_HOST}
        username: ${SMTP_USER}
        password: ${SMTP_PASSWORD}
        properties:
            mail:
                smtp:
                    port: ${SMTP_PORT}
                    auth: true
                    starttls:
                        enable: true

swagger:
    protocol: https

logging:
    level:
        com.wutsi: INFO

ndopify:
    storage:
        default-type: s3
        s3:
            bucket: com-wutsi-ndopify-test
            region: us-east-1
