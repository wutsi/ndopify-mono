spring:
    flyway:
        clean-disabled: false
        locations: "classpath:db/migration/common,classpath:db/migration/test"
    jpa:
        show-sql: false
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    mail:
        host: ${SMTP_HOST}
        username: ${SMTP_USER}
        password: ${SMTP_PASSWORD}
        properties:
            mail:
                smtp:
                    port: ${SMTP_PORT}
                    auth: true
                    starttls:
                        enable: true

swagger:
    protocol: https

logging:
    level:
        com.wutsi: INFO

ndopify:
    database:
        pool-size: 16
    image:
        type: image-kit
        image-kit:
            origin-url: "https://${ndopify.storage.s3.bucket}.s3.amazonaws.com"
            endpoint-url: "${IMAGE_KIT_ENDPOINT_URL}"
    security:
        jwt:
            secret: ${JWT_SECRET}          # No default: the server doesn't start without it

    telegram:
        transport: webhook
        webhook:
            url: ${SERVER_URL}/telegram/webhook
            secret: ${TELEGRAM_WEBHOOK_SECRET}

    mobile-money:
        mtn:
            collection:
                subscription-key: ${MTN_COLLECTION_SUBSCRIPTION_KEY}

    storage:
        default-type: s3
        s3:
            bucket: com-wutsi-ndopify-test
            region: us-east-1
