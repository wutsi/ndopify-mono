<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(
    'Votre visite — Ndopify',
    null,
    null,
    null,
    null,
    null,
    'noindex, nofollow',
    null,
    null,
    false,
    true,
    null)}"></head>
<!--/*
  A visit link that can't be opened (VisitController): `reason` is "expired" (signed out, or the token was refused) or
  "not-yours" (the token is another customer's). Nothing about the visit is shown.
*/-->
<body data-page="visit-link">
<th:block th:replace="~{fragments/site-header :: header(null, null, true)}"></th:block>

<main id="main">
    <section class="section section--default">
        <div class="container hero">
            <h1>Votre visite</h1>
            <p class="hero__sub" th:if="${reason == 'not-yours'}">Ce lien a été envoyé à une autre personne.</p>
            <p class="hero__sub" th:unless="${reason == 'not-yours'}">Ce lien a expiré. Demandez à votre agent de vous
                renvoyer le lien de la visite.</p>
        </div>
    </section>
</main>
</body>
</html>
