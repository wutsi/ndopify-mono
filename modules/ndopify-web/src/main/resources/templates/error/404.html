<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Page introuvable — Ndopify', null, null, null, null, null, 'noindex, nofollow', null, false, false, null)}"></head>
<!--/*
  The 404 page: an unknown address, or a listing ndopify-server doesn't publish anymore (HttpClientErrorHandler).
  Rendered by Spring Boot's error controller, outside of the page that failed: Ndopify's own logo, not the tenant's.
*/-->
<body data-page="error-404">
<th:block th:replace="~{fragments/site-header :: header(null, null, false)}"></th:block>

<main id="main">
    <section class="section section--default">
        <div class="container hero">
            <h1>Page introuvable</h1>
            <p class="hero__sub">Ce logement n'est plus en ligne, ou l'adresse est erronée.</p>
            <div class="cta-row">
                <a class="btn btn-primary" th:href="@{/}">Retour à l'accueil</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/site-footer :: footer('© 2026 Ndopify. Logements vérifiés. Locations fiables.', false)}"></footer>
</body>
</html>
