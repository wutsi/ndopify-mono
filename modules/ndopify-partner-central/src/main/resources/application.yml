spring:
    http:
        clients:
            # Spring-built RestClients (Spring Boot's HttpClientSettings); RestConfiguration applies the same to the
            # clients it builds by hand.
            connect-timeout: 5s
            read-timeout: 30s

    jackson:
        default-property-inclusion: non_null
        use-jackson2-defaults: true
        deserialization:
            FAIL_ON_UNKNOWN_PROPERTIES: false
            FAIL_ON_NULL_FOR_PRIMITIVES: false
            ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
        mapper:
            ACCEPT_CASE_INSENSITIVE_ENUMS: true
            ACCEPT_CASE_INSENSITIVE_PROPERTIES: true

    servlet:
        multipart:
            # Same as ndopify-server. Photos over 5 MB are refused by KycController with a proper message;
            # beyond this limit KycUploadErrorHandler does.
            max-file-size: 10MB
            max-request-size: 10MB

    web:
        resources:
            # Renders the @{…} asset URLs as …-<hash>.<ext>, so the year-long immutable cache of /assets/dist/
            # never pins a stale bundle after a deploy.
            chain:
                enabled: true
                strategy:
                    content:
                        enabled: true
                        paths: /assets/**

server:
    port: 8081
    servlet:
        session:
            cookie:
                # Not sent on another site's POST (CSRF) into the session's sign-in or wizard. Lax, not Strict, which
                # would drop it when arriving from a link (ex: in an e-mail).
                same-site: lax
                http-only: true
    # Behind a proxy (Heroku's router), Tomcat's RemoteIpValve sets the client's IP, scheme and host from the
    # X-Forwarded-* headers, trusted only from internal proxies (server.tomcat.remoteip.internal-proxies).
    forward-headers-strategy: native
    tomcat:
        # Lets Tomcat read past the multipart limit so the redirect reaches the browser instead of a reset connection.
        max-swallow-size: 20MB
    error:
        whitelabel:
            enabled: false
    compression:
        enabled: true
        mime-types: application/json,application/xml,text/html,text/xml,text/plain
        min-response-size: 512

management:
    endpoint:
        health:
            show-details: always
        info:
            git:
                mode: full
    endpoints:
        web:
            exposure:
                include: "beans,flyway,health,info,scheduledtasks,mappings"

logging:
    level:
        root: INFO
        com.amazonaws: ERROR
        org.springframework: INFO
        com.wutsi: DEBUG
        springfox: ERROR
    pattern:
        console: "%d level=%level logger=%c{20} %m%n"
        file: "%d level=%level logger=%c{20} %m%n"

ndopify:
    server:
        api:
            base-url: http://localhost:8080
    telegram:
        username: ${TELEGRAM_BOT_USERNAME:ndopify_bot}   # The bot's public username, for https://t.me/<bot>
        code-ttl-minutes: 15   # Mirrors ndopify.agent.telegram.code-ttl-minutes on ndopify-server
