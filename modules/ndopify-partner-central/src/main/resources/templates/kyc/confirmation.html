<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Dossier envoyé — Ndopify Partner Central</title>
    <meta content="Votre dossier de vérification d'identité a bien été reçu par Ndopify." name="description">
    <meta content="noindex, nofollow" name="robots">
    <meta content="#ffffff" name="theme-color">
    <link href="assets/images/icon.png" rel="icon" type="image/png">
    <link href="assets/images/icon.png" rel="apple-touch-icon">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&amp;family=Montserrat:wght@400;600&amp;display=swap"
          rel="stylesheet">
    <link href="assets/css/partner-central.css" rel="stylesheet">
    <script defer src="assets/js/partner-central.js"></script>
</head>
<body data-page="kyc-confirmation">
<a class="skip-link" href="#main">Aller au contenu</a>
<header class="site-header">
    <div class="site-header__inner">
        <a class="site-header__brand" href="../index.html">
            <img alt="Ndopify, accueil" height="40" src="assets/images/logo.png" width="84">
        </a>
        <nav aria-label="Compte" class="user-menu">
            <button aria-controls="user-menu" aria-expanded="false" class="user-menu__toggle" data-user-menu-toggle
                    type="button">
                <span class="visually-hidden">Menu du compte</span>
                <span aria-hidden="true" data-user-initials>NP</span>
            </button>
            <ul class="user-menu__list" data-user-menu-list hidden id="user-menu">
                <li class="user-menu__email" data-user-email></li>
                <li>
                        <span aria-disabled="true" class="user-menu__item">
                            Profil <span class="user-menu__soon">(bientôt disponible)</span>
                        </span>
                </li>
                <li><a class="user-menu__item" data-logout th:href="@{/logout}">Déconnexion</a></li>
            </ul>
        </nav>
    </div>
</header>
<main class="page" id="main">
    <div class="column confirmation stack">
        <span class="confirmation__mark"><svg aria-hidden="true" class="confirmation__icon" focusable="false"
                                              viewBox="0 0 20 20"><circle cx="10" cy="10" fill="none" r="8.25"
                                                                        stroke="currentColor" stroke-width="1.5"/><path
            d="m6.5 10.25 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="1.5"/></svg></span>
        <h1>Dossier envoyé</h1>
        <p>Nous avons bien reçu vos documents. Leur examen prend jusqu'à 24&nbsp;heures.</p>
        <p>Vous recevrez une notification par email et par SMS dès que l'examen sera terminé.</p>
        <div class="cta-row">
            <a class="btn btn--primary" href="index.html">Voir le statut de mon dossier</a>
        </div>
    </div>
</main>
</body>
</html>
