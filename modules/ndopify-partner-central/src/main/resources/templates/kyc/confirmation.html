<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dossier envoyé — Ndopify Partner Central</title>
    <meta name="description" content="Votre dossier de vérification d'identité a bien été reçu par Ndopify.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="../assets/images/icon.png">
    <link rel="apple-touch-icon" href="../assets/images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@700&amp;family=Montserrat:wght@400;600&amp;display=swap">
    <link rel="stylesheet" href="../assets/css/partner-central.css">
    <script src="../assets/js/partner-central.js" defer></script>
</head>
<body data-page="kyc-confirmation">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__brand" href="../index.html">
                <img src="../assets/images/logo.png" alt="Ndopify, accueil" width="84" height="40">
            </a>
            <nav class="user-menu" aria-label="Compte">
                <button type="button" class="user-menu__toggle" aria-expanded="false" aria-controls="user-menu"
                        data-user-menu-toggle>
                    <span class="visually-hidden">Menu du compte</span>
                    <span aria-hidden="true" data-user-initials>NP</span>
                </button>
                <ul id="user-menu" class="user-menu__list" hidden data-user-menu-list>
                    <li class="user-menu__email" data-user-email></li>
                    <li>
                        <span class="user-menu__item" aria-disabled="true">
                            Profil <span class="user-menu__soon">(bientôt disponible)</span>
                        </span>
                    </li>
                    <li><a class="user-menu__item" href="../login/index.html" data-logout>Déconnexion</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main id="main" class="page">
        <div class="column confirmation stack">
            <span class="confirmation__mark"><svg class="confirmation__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m6.5 10.25 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <h1>Dossier envoyé</h1>
            <p>Nous avons bien reçu vos documents. Leur examen prend jusqu'à 24&nbsp;heures.</p>
            <p>Vous recevrez une notification par email et par SMS dès que l'examen sera terminé.</p>
            <div class="cta-row">
                <a class="btn btn--primary" href="index.html">Voir le statut de mon dossier</a>
            </div>
        </div>
    </main>
</body>
</html>
