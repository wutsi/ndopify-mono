<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- One card of *Visites d'autres agents*: never A's customer, note, code, address, report or feedback. -->
<li th:fragment="coBrokerageVisit(v)" class="co-visit-card">
    <article>
        <div class="co-visit-card__head">
            <p class="co-visit-card__when">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                <span th:text="${v.at}">dimanche 22 novembre 2026 à 10:30</span>
            </p>
            <p class="status-tag status-tag--info" th:if="${v.inProgress}">En cours</p>
        </div>
        <p class="co-visit-card__listing">
            <svg class="icon" th:unless="${v.video}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false" data-co-brokerage-type-icon="ON_SITE"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
            <svg class="icon" th:if="${v.video}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false" data-co-brokerage-type-icon="VIDEO"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg>
            <span th:text="${v.typeLabel}">Sur place</span>
            <th:block th:if="${v.listingTitle != null}">
                <span aria-hidden="true">·</span>
                <a th:href="@{${v.listingUrl}}" th:text="${v.listingTitle}">Appartement 2 chambres · Bonapriso</a>
            </th:block>
        </p>
        <div th:replace="~{fragments/agent-card :: agentCard(${v.agent}, false)}"></div>
    </article>
</li>
</body>
</html>
