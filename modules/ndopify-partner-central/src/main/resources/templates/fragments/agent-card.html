<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The one standard card that names another agent: at the bottom of a card, or boxed on a page (standalone). A photo,
  else their initials, else a generic person; the name linked back to where the card was opened; WhatsApp in text on
  the right, without the number. Anti-bypass: only the agent's identity, never its customer, mandate, match, code or
  report. `agent` is an AgentCardView, or null when the agent can't be read ("un autre agent", unlinked).
*/-->
<div th:fragment="agentCard(agent, standalone)" class="agent-card" data-agent-card
     th:classappend="${standalone} ? 'agent-card--standalone'">
    <span class="agent-card__avatar" aria-hidden="true">
        <img th:if="${agent?.photoUrl}" th:src="${agent.photoUrl}" alt="">
        <span th:if="${agent != null and agent.photoUrl == null}" th:text="${agent.initials}">CM</span>
        <svg th:if="${agent == null}" class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="1.5" focusable="false"><circle cx="10" cy="6.5" r="3.25"/><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke-linecap="round"/></svg>
    </span>
    <a class="agent-card__name" th:if="${agent != null}" th:href="${agent.profileUrl}">
        <span th:text="${agent.name}">Clarisse Mbarga</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
    <span class="agent-card__name" th:if="${agent == null}">un autre agent</span>
    <a class="agent-card__whatsapp" th:if="${agent?.whatsappUrl}" th:href="${agent.whatsappUrl}" target="_blank"
       rel="noopener" th:attr="aria-label=|WhatsApp — ${agent.name}|">
        <svg th:replace="~{fragments/icon :: whatsapp}"></svg>
        WhatsApp
    </a>
</div>
</body>
</html>
