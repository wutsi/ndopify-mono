<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Accès refusé — Ndopify Partner Central', null, false)}"></head>
<!--/*
  The 403 page: ndopify-server refused what the page asked (HttpClientErrorHandler), ex: another agent's data.
  Rendered by Spring Boot's error controller, outside of the page that failed: no account menu, since the signed-in
  agent isn't known there.
*/-->
<body data-page="error-403">
    <th:block th:replace="~{fragments/site-header :: header(@{/}, false)}"></th:block>
    <main id="main" class="page">
        <div class="column">
            <div class="page-intro" data-error="403">
                <h1>Accès refusé</h1>
                <p>Cette page n'est pas, ou plus, accessible depuis votre compte.</p>
            </div>
            <p class="cta-row"><a class="btn btn--primary" th:href="@{/}">Retour à l'espace agent</a></p>
        </div>
    </main>
</body>
</html>
