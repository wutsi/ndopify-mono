<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Page introuvable — Ndopify Partner Central', null, false)}"></head>
<!--/*
  The 404 page: an unknown address, or something ndopify-server doesn't know (HttpClientErrorHandler).
  Rendered by Spring Boot's error controller, outside of the page that failed: no account menu, since the signed-in
  agent isn't known there.
*/-->
<body data-page="error-404">
    <th:block th:replace="~{fragments/site-header :: header(@{/}, false)}"></th:block>
    <main id="main" class="page">
        <div class="column">
            <div class="page-intro" data-error="404">
                <h1>Page introuvable</h1>
                <p>Cette page n'existe pas, ou plus. Vérifiez l'adresse, ou repartez de votre espace agent.</p>
            </div>
            <p class="cta-row"><a class="btn btn--primary" th:href="@{/}">Retour à l'espace agent</a></p>
        </div>
    </main>
</body>
</html>
