name: ndopify-esignature-main


on:
    push:
        branches:
            - main
        paths:
            - 'modules/ndopify-esignature/**'
            - '.github/workflows/ndopify-esignature-main.yml'
            - '!modules/ndopify-esignature/*.md'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 17

            -   name: Build
                env:
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                run: |
                    mvn -q -s settings.xml --non-recursive install
                    cd modules/ndopify-esignature
                    mvn -q -s ../../settings.xml install

            -   name: Upload app bundle
                uses: actions/upload-artifact@v7
                with:
                    name: appbundle
                    path: modules/ndopify-esignature/target/*.jar

            -   name: Upload JaCoCo Report
                uses: actions/upload-artifact@v7
                with:
                    name: jacoco
                    path: modules/ndopify-esignature/target/site/jacoco/**/*

            -   name: Generate JaCoCo Badge
                uses: cicirello/jacoco-badge-generator@v2
                with:
                    generate-branches-badge: false
                    jacoco-csv-file: modules/ndopify-esignature/target/site/jacoco/jacoco.csv
                    coverage-badge-filename: ndopify-esignature-jacoco.svg

            -   name: Commit the badge (if it changed)
                continue-on-error: true
                run: |
                    if [[ `git status --porcelain` ]]; then
                      git config user.email "actions@github.com"
                      git config user.name "GitHub Actions"
                      git add -A
                      git commit -m "Autogenerated JaCoCo coverage badge"
                      git push
                    fi

    deploy-test:
        runs-on: ubuntu-latest
        needs: [ build ]
        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 17

            -   name: Get artifact
                uses: actions/download-artifact@v8
                with:
                    name: appbundle

            -   name: Prepare Heroku Files
                env:
                    HEROKU_APP: ndopify-esignature-test
                    HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
                run: |
                    curl https://cli-assets.heroku.com/install.sh | sh
                    curl -L -O https://github.com/heroku/heroku-jvm-application-deployer/releases/download/v4.0.14/heroku-jvm-application-deployer-4.0.14.jar
                    cp modules/ndopify-esignature/system.properties .
                    cp modules/ndopify-esignature/Procfile .
                    heroku config:set --app ${HEROKU_APP} SPRING_PROFILES_ACTIVE=test
                    heroku config:set --app ${HEROKU_APP} NDOPIFY_SERVER_URL=${{secrets.NDOPIFY_SERVER_URL}}
                    java -jar heroku-jvm-application-deployer-4.0.14.jar --app=${HEROKU_APP} ndopify-esignature.jar
