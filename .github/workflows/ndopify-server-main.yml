name: ndopify-server-main


on:
    push:
        branches:
            - main
        paths:
            - 'modules/ndopify-server/**'
            - '.github/workflows/ndopify-server-main.yml'
            - '!modules/ndopify-server/*.md'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:26.7
                env:
                    MYSQL_USER: admin
                    MYSQL_PASSWORD: admin
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: ndopify
                ports:
                    - 3306:3306

        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 17

            -   name: Build
                env:
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                    KIMI_API_KEY: ${{secrets.KIMI_API_KEY}}
                    MTN_COLLECTION_SUBSCRIPTION_KEY: ${{secrets.MTN_COLLECTION_SUBSCRIPTION_KEY}}
                run: |
                    mvn -q -s settings.xml --non-recursive install
                    cd modules/ndopify-server
                    mvn -Dspring.datasource.username=root -Dspring.datasource.password=root -q -s ../../settings.xml install

            -   name: Upload app bundle
                uses: actions/upload-artifact@v7
                with:
                    name: appbundle
                    path: modules/ndopify-server/target/*.jar

            -   name: Upload JaCoCo Report
                uses: actions/upload-artifact@v7
                with:
                    name: jacoco
                    path: modules/ndopify-server/target/site/jacoco/**/*

            -   name: Generate JaCoCo Badge
                uses: cicirello/jacoco-badge-generator@v2
                with:
                    generate-branches-badge: false
                    jacoco-csv-file: modules/ndopify-server/target/site/jacoco/jacoco.csv
                    coverage-badge-filename: ndopify-server-jacoco.svg

            -   name: Commit the badge (if it changed)
                continue-on-error: true
                run: |
                    if [[ `git status --porcelain` ]]; then
                      git config user.email "actions@github.com"
                      git config user.name "GitHub Actions"
                      git add -A
                      git commit -m "Autogenerated JaCoCo coverage badge"
                      git push
                    fi


    deploy-test:
        runs-on: ubuntu-latest
        needs: [ build ]
        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 17

            -   name: Get artifact
                uses: actions/download-artifact@v8
                with:
                    name: appbundle

            -   name: Prepare Heroku Files
                env:
                    HEROKU_APP: ndopify-server-test
                    HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
                run: |
                    curl https://cli-assets.heroku.com/install.sh | sh
                    curl -L -O https://github.com/heroku/heroku-jvm-application-deployer/releases/download/v4.0.14/heroku-jvm-application-deployer-4.0.14.jar
                    cp modules/ndopify-server/system.properties .
                    cp modules/ndopify-server/Procfile .
                    heroku config:set --app ${HEROKU_APP} SPRING_PROFILES_ACTIVE=test
                    heroku config:set --app ${HEROKU_APP} AWS_ACCESS_KEY=${{secrets.AWS_ACCESS_KEY}}
                    heroku config:set --app ${HEROKU_APP} AWS_SECRET_KEY=${{secrets.AWS_SECRET_KEY}}
                    heroku config:set --app ${HEROKU_APP} SMTP_USER=${{secrets.SMTP_USER}}
                    heroku config:set --app ${HEROKU_APP} SMTP_PASSWORD=${{secrets.SMTP_PASSWORD}}
                    heroku config:set --app ${HEROKU_APP} SMTP_HOST=${{secrets.SMTP_HOST}}
                    heroku config:set --app ${HEROKU_APP} SMTP_PORT=${{secrets.SMTP_PORT}}
                    heroku config:set --app ${HEROKU_APP} MTN_COLLECTION_SUBSCRIPTION_KEY=${{secrets.MTN_COLLECTION_SUBSCRIPTION_KEY}}
                    java -jar heroku-jvm-application-deployer-4.0.14.jar --app=${HEROKU_APP} ndopify-server.jar
