name: ndopify-server-main


on:
    push:
        branches:
            - main
        paths:
            - 'modules/ndopify-server/**'
            - '.github/workflows/ndopify-server-main.yml'
            - '!modules/ndopify-server/*.md'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:26.10
                env:
                    MYSQL_USER: admin
                    MYSQL_PASSWORD: admin
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: ndopify
                ports:
                    - 3306:3306

        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 25

            -   name: MySQL max_connections
                run: |
                    for i in $(seq 1 30); do
                        mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" && break
                        sleep 2
                    done
                    mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL max_connections = 500"

            -   name: Build
                env:
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                run: |
                    mvn -q -s settings.xml --non-recursive install
                    cd modules/ndopify-server
                    mvn -Dlogging.level.root=WARN -Dspring.datasource.username=root -Dspring.datasource.password=root -q -s ../../settings.xml install

            -   name: Upload app bundle
                uses: actions/upload-artifact@v7
                with:
                    name: appbundle
                    path: modules/ndopify-server/target/*.jar

            -   name: Upload JaCoCo Report
                uses: actions/upload-artifact@v7
                with:
                    name: jacoco
                    path: modules/ndopify-server/target/site/jacoco/**/*

            -   name: Generate JaCoCo Badge
                uses: cicirello/jacoco-badge-generator@v2
                with:
                    generate-branches-badge: false
                    jacoco-csv-file: modules/ndopify-server/target/site/jacoco/jacoco.csv
                    coverage-badge-filename: ndopify-server-jacoco.svg

            -   name: Commit the badge (if it changed)
                continue-on-error: true
                run: |
                    if [[ `git status --porcelain` ]]; then
                      git config user.email "actions@github.com"
                      git config user.name "GitHub Actions"
                      git add -A
                      git commit -m "Autogenerated JaCoCo coverage badge"
                      git push
                    fi


    deploy-test:
        runs-on: ubuntu-latest
        needs: [ build ]
        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 25

            -   name: Get artifact
                uses: actions/download-artifact@v8
                with:
                    name: appbundle

            -   name: Prepare Heroku Files
                env:
                    HEROKU_APP: ndopify-server-test
                    HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
                    AWS_ACCESS_KEY: ${{secrets.AWS_ACCESS_KEY}}
                    AWS_SECRET_KEY: ${{secrets.AWS_SECRET_KEY}}
                    DB_URL: ${{secrets.DB_URL}}
                    DB_USER: ${{secrets.DB_USER}}
                    DB_PASSWORD: ${{secrets.DB_PASSWORD}}
                    DEEPSEEK_API_KEY: ${{secrets.DEEPSEEK_API_KEY}}
                    IMAGE_KIT_ENDPOINT_URL: ${{secrets.IMAGE_KIT_ENDPOINT_URL}}
                    MTN_COLLECTION_SUBSCRIPTION_KEY: ${{secrets.MTN_COLLECTION_SUBSCRIPTION_KEY}}
                    SMTP_USER: ${{secrets.SMTP_USER}}
                    SMTP_PASSWORD: ${{secrets.SMTP_PASSWORD}}
                    SMTP_HOST: ${{secrets.SMTP_HOST}}
                    SMTP_PORT: ${{secrets.SMTP_PORT}}
                    JWT_SECRET: ${{secrets.JWT_SECRET}}
                    SERVER_URL: ${{secrets.SERVER_URL}}
                    TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
                    TELEGRAM_BOT_USERNAME: ${{secrets.TELEGRAM_BOT_USERNAME}}
                    TELEGRAM_WEBHOOK_SECRET: ${{secrets.TELEGRAM_WEBHOOK_SECRET}}
                run: |
                    curl https://cli-assets.heroku.com/install.sh | sh
                    curl -L -O https://github.com/heroku/heroku-jvm-application-deployer/releases/download/v4.0.14/heroku-jvm-application-deployer-4.0.14.jar
                    cp modules/ndopify-server/system.properties .
                    cp modules/ndopify-server/Procfile .
                    heroku config:set --app ${HEROKU_APP} SPRING_PROFILES_ACTIVE=test
                    heroku config:set --app "$HEROKU_APP" AWS_ACCESS_KEY="$AWS_ACCESS_KEY"
                    heroku config:set --app "$HEROKU_APP" AWS_SECRET_KEY="$AWS_SECRET_KEY"
                    heroku config:set --app "$HEROKU_APP" DB_URL="$DB_URL"
                    heroku config:set --app "$HEROKU_APP" DB_USER="$DB_USER"
                    heroku config:set --app "$HEROKU_APP" DB_PASSWORD="$DB_PASSWORD"
                    heroku config:set --app "$HEROKU_APP" IMAGE_KIT_ENDPOINT_URL="$IMAGE_KIT_ENDPOINT_URL"
                    heroku config:set --app "$HEROKU_APP" SMTP_USER="$SMTP_USER"
                    heroku config:set --app "$HEROKU_APP" SMTP_PASSWORD="$SMTP_PASSWORD"
                    heroku config:set --app "$HEROKU_APP" SMTP_HOST="$SMTP_HOST"
                    heroku config:set --app "$HEROKU_APP" SMTP_PORT="$SMTP_PORT"
                    heroku config:set --app "$HEROKU_APP" JWT_SECRET="$JWT_SECRET"
                    heroku config:set --app "$HEROKU_APP" SERVER_URL="$SERVER_URL"
                    heroku config:set --app "$HEROKU_APP" TELEGRAM_TOKEN="$TELEGRAM_TOKEN"
                    heroku config:set --app "$HEROKU_APP" TELEGRAM_BOT_USERNAME="$TELEGRAM_BOT_USERNAME"
                    heroku config:set --app "$HEROKU_APP" TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET"
                    java -jar heroku-jvm-application-deployer-4.0.14.jar --app=${HEROKU_APP} ndopify-server.jar
