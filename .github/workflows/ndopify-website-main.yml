name: ndopify-website


on:
    push:
        branches:
            - main
        paths:
            - 'modules/ndopify-website/**'
            - '.github/workflows/ndopify-website-main.yml'
            - '!modules/ndopify-website/*.md'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 17
    deploy-s3-test:
        runs-on: ubuntu-latest
        needs: [ build ]
        steps:
            -   uses: actions/checkout@v7

            -   name: Deploy-Test
                env:
                    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
                    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                run: |
                    aws s3 sync \
                      --acl public-read \
                      --region us-east-1 \
                      modules/ndopify-website/src/main/html/ s3://com-wutsi-ndopify-test/www

