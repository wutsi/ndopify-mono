name: ndopify-web-core-main

on:
    push:
        branches:
            - main
        paths:
            - 'modules/ndopify-web-core/**'
            - '.github/workflows/ndopify-web-core-main.yml'
            - '!modules/ndopify-web-core/*.md'

permissions:
    contents: write
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   name: JDK
                uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: 17
            -   name: Set up Maven
                uses: stCarolas/setup-maven@v5.1
                with:
                    maven-version: 3.10.0

            -   name: Build
                env:
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                run: |
                    mvn -q -s settings.xml --non-recursive install
                    cd modules/ndopify-web-core
                    mvn -q -s ../../settings.xml install

            -   name: Upload JaCoCo Report
                uses: actions/upload-artifact@v7
                with:
                    name: jacoco
                    path: modules/ndopify-web-core/target/site/jacoco/**/*

            -   name: Generate JaCoCo Badge
                uses: cicirello/jacoco-badge-generator@v2
                with:
                    generate-branches-badge: false
                    jacoco-csv-file: modules/ndopify-web-core/target/site/jacoco/jacoco.csv
                    coverage-badge-filename: ndopify-web-core-jacoco.svg

            -   name: Commit the badge (if it changed)
                continue-on-error: true
                run: |
                    if [[ `git status --porcelain .github/badges` ]]; then
                      git config user.email "actions@github.com"
                      git config user.name "GitHub Actions"
                      git add .github/badges
                      git commit -m "Autogenerated JaCoCo coverage badge"
                      git push
                    fi

            -   name: Release
                env:
                    GITHUB_USER: ${{github.actor}}
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                run: |
                    cd modules/ndopify-web-core
                    git config user.email "actions@github.com"
                    git config user.name "GitHub Actions"
                    git pull
                    mvn -q -B -s ../../settings.xml release:prepare release:perform
